<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" content="{{ csrf }}"><title>{% block title %}Max’s Menu{% endblock %}</title><link rel="stylesheet" href="/static/admin.css"><script src="/static/common.js" defer></script>{% block scripts %}{% endblock %}</head><body data-role="{{ user.role if user else '' }}"><main>
<header class="app-header"><div><a class="brand" href="/">Max’s Menu</a><span class="site-name">{{ site_name }}</span><span class="version">v{{ version }}</span></div>{% if user %}<nav><a href="/admin">Edit Menus</a><a href="/history">History</a><a href="/account">My Account</a>{% if is_admin %}<a href="/schedule">Schedule</a><a href="/theme">Theme</a><a href="/system">System</a><a href="/users">Users</a>{% endif %}<span class="identity">{{ user.username }}</span><form action="/logout" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit">Sign out</button></form></nav>{% endif %}</header>
{% block content %}{% endblock %}</main></body></html>
